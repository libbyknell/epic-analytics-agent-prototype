<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo launcher</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="demo-title" content="Quinn: autonomous insight and follow-up Q&A">
<!-- Backstage launcher (not product UI). Opens scene 1; lists every scene/beat from _kit/demo-flow/scenes.js. -->
<style>
  body { margin: 0; min-height: 100vh; background: #0f1115; color: #d9dce3; font: 15px/1.5 -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  main { width: min(860px, 92vw); }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #8b90a0; margin: 0 0 24px; }
  a.start { display: inline-block; background: #e8b400; color: #111; font-weight: 700; padding: 10px 22px; border-radius: 6px; text-decoration: none; margin-bottom: 28px; }
  ol { padding-left: 20px; } li { margin: 0 0 10px; }
  li b { color: #fff; font-weight: 600; margin-right: 10px; }
  li a { color: #9cc8ff; text-decoration: none; margin-right: 10px; font: 13px ui-monospace, Menlo, monospace; }
  kbd { border: 1px solid #555; border-radius: 3px; padding: 0 5px; font: 12px ui-monospace, Menlo, monospace; }
  .keys { color: #8b90a0; font-size: 13px; margin-top: 24px; }
</style></head>
<body><main>
  <h1 id="title">Demo</h1>
  <p class="sub">Click the UI the way the script says. Prompts type themselves; press <kbd>Enter</kbd> or click send.</p>
  <a class="start" id="start" href="#">Start the demo</a>
  <ol id="list"></ol>
  <p class="keys"><kbd>→</kbd> next / hurry · <kbd>←</kbd> back a beat · <kbd>`</kbd> backstage beat list · <kbd>Shift</kbd>+<kbd>R</kbd> restart scene · URL <code>?beat=ID</code></p>
</main>
<script src="_kit/demo-flow/scenes.js"></script>
<script>
  var S = window.DEMO_SCENES || [];
  document.title = document.getElementById('title').textContent = document.querySelector('meta[name=demo-title]') ? document.querySelector('meta[name=demo-title]').content : 'Demo';
  if (S[0]) document.getElementById('start').href = S[0].url;
  document.getElementById('list').innerHTML = S.map(function (s) {
    return '<li><b>' + s.id + '</b>' + (s.beats || []).map(function (b) { return '<a href="' + s.url + '?beat=' + b + '">' + b + '</a>'; }).join('') + '</li>';
  }).join('');
</script>
</body></html>
